name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # 打 v1.6 这样的 tag 时自动构建并发布
  workflow_dispatch:      # 也可在 Actions 页面手动运行

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller aiohttp requests

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name NPCSpellLookup `
            --hidden-import aiohttp --hidden-import multidict --hidden-import yarl `
            spell_lookup_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NPCSpellLookup-Windows
          path: dist/NPCSpellLookup.exe

      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NPCSpellLookup.exe
